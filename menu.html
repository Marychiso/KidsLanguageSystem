<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Menu</title>
  <link rel="stylesheet" href="menu.css">
</head>

<body>

<div class="container">

  <h1>📚 Let's Learn English!</h1>

  <p class="subtitle">Choose what you want to do</p>

  <div class="menu-cards">

    <div class="menu-card lessons">
      <div class="menu-icon">📚</div>
      <div class="menu-title">Take Lessons</div>
    </div>

    <div class="menu-card quizzes">
      <div class="menu-icon">📝</div>
      <div class="menu-title">Take Quizzes</div>
    </div>

    <div class="menu-card stories">
      <div class="menu-icon">📖</div>
      <div class="menu-title">Read Stories</div>
    </div>

    <div class="menu-card games">
      <div class="menu-icon">🎮</div>
      <div class="menu-title">Play Games</div>
    </div>

    <!-- BADGES CARD -->
    <div class="menu-card badges">
      <div class="menu-icon">🏅</div>
      <div class="menu-title">My Badges</div>
    </div>

  </div>

</div>

<!-- ✅ BOTTOM NAVIGATION -->
<div class="bottom-nav">
  <button onclick="goLanguages()">⬅ Choose Language</button>
</div>

<script src="menu.js"></script>
</body>
</html>
