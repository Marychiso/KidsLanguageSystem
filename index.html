<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Language Learning - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1> Kids Language Learning </h1>

    <!-- Login Form -->
    <form id="loginForm" class="form active">
      <h2>Login</h2>
      <input type="text" id="loginUsername" placeholder="Username" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit">Login</button>
      <p class="switch">Don't have an account? <span id="showRegister">Register</span></p>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="form">
  <h2>Register</h2>

  <input type="text" id="registerUsername" placeholder="Username" required>
  <input type="email" id="registerEmail" placeholder="Email" required>
  <input type="password" id="registerPassword" placeholder="Password" required>
  <input type="password" id="registerConfirmPassword" placeholder="Confirm Password" required>
  <button type="submit">Register</button>

  <p class="switch">Already have an account? <span id="showLogin">Login</span></p>
</form>
  </div>

  <script src="script.js"></script>
</body>
</html>
