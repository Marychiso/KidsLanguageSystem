<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meet the Colors 🎨</title>
  <link rel="stylesheet" href="colors.css">
</head>
<body>
<h1>🎨 Meet the Colors</h1>

<!-- ================= SCREEN 1 ================= -->
<div id="screen1" class="screen active">

  <p id="colorText" class="story-text">This is red</p>

  <!-- YOU WILL ADD YOUR IMAGES HERE -->
  <img id="colorImage" class="color-img" src="assets/images/watermelon.jpg">

  <div class="buttons">
    <button onclick="goLessons()">⬅ Lessons</button>
    <button onclick="nextColor()">Next Color ▶</button>
    <button onclick="nextScreen()">Next▶</button>
  </div>

</div>

<!-- ================= SCREEN 2 ================= -->
<div id="screen2" class="screen">

  <p class="story-text">
    These are colors. Red, blue, yellow, orange, purple, green and white
  </p>

  <div class="colors-grid">

    <!-- ADD YOUR IMAGES -->
    <div class="color-item">
      <img src="assets/images/watermelon.jpg">
      <span>Red</span>
    </div>

    <div class="color-item">
      <img src="assets/images/blueball.jpg">
      <span>Blue</span>
    </div>

    <div class="color-item">
      <img src="assets/images/yellowbanana.jpg">
      <span>Yellow</span>
    </div>

    <div class="color-item">
      <img src="assets/images/orange.jpg">
      <span>Orange</span>
    </div>

    <div class="color-item">
      <img src="assets/images/grape.jpg">
      <span>Purple</span>
    </div>

    <div class="color-item">
      <img src="assets/images/green.jpg">
      <span>Green</span>
    </div>

    <div class="color-item">
      <img src="assets/images/whitebunny.jpg">
      <span>White</span>
    </div>

  </div>

  <div class="buttons">
    <button onclick="back()">⬅ Back</button>
    <button onclick="goLessons()">Finish ✔</button>
  </div>

</div>

<script src="colors.js"></script>
</body>
</html>
