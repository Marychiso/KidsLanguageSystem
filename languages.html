<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Language</title>
  <link rel="stylesheet" href="languages.css">
</head>
<body>

  <div class="container">
    <h1>🌍 Choose a Language 🌍</h1>
    <p class="subtitle">Pick a language to start learning!</p>

    <div class="languages">

      <button class="lang-btn disabled">🇪🇸 Spanish</button>
      <button class="lang-btn disabled">🇫🇷 French</button>

      <!-- ONLY ACTIVE BUTTON -->
      <button class="lang-btn active" id="englishBtn">🇬🇧 English</button>

      <button class="lang-btn disabled">🇨🇳 Chinese</button>
      <button class="lang-btn disabled">🇰🇪 Swahili</button>

    </div>
  </div>

  <script src="languages.js"></script>
</body>
</html>
